name: Android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CURVE_VERSION: 0.2.0-SNAPSHOT

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - name: Build, lint and publish local AAR with sources
        run: ./gradlew :sample:assembleDebug :sample:assembleDebugAndroidTest :sample:lintDebug :curve-view:lintRelease :curve-view:publishReleasePublicationToVerificationRepository -Pversion="$CURVE_VERSION"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run sample and published AAR consumer instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            ./gradlew :sample:connectedDebugAndroidTest
            adb shell settings put global animator_duration_scale 1
            ./gradlew :sample:connectedDebugAndroidTest
            ./scripts/verify-consumer.sh "$GITHUB_WORKSPACE/build/repository" "$CURVE_VERSION" --connected
      - name: Upload build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api-${{ matrix.api }}
          path: |
            sample/build/outputs/apk/
            sample/build/reports/
            sample/build/outputs/androidTest-results/
            curve-view/build/reports/
            build/repository/
            build/consumer/
